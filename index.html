    <style>
      /* 3. CRITICAL CSS: Inline only what is needed for the first paint */
      :root {
        --indigo-600: #4f46e5;

      }
      body {
        margin: 0;
        background: #ffffff;
        overflow-x: hidden;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
        }
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .pulse {
        width: 40px;
        height: 40px;
        background-color: var(--indigo-600);
        border-radius: 100%;
        animation: sk-scaleout 1s infinite ease-in-out;
      }
      @keyframes sk-scaleout {
        0% {
          transform: scale(0);
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="pulse"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
