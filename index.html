    /* CRITICAL CSS: Inline only what is needed for the first paint */
    :root {
      --indigo-600: #4f46e5;
    }

    html {
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background: #ffffff;
      --loader-logo-primary: #0f2060;
      --loader-logo-secondary: #5730f5;
      overflow-x: hidden;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #020617;
        --loader-logo-primary: #ffffff;
        --loader-logo-secondary: #818cf8;
      }
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background: #ffffff;
      --loader-logo-primary: #0f2060;
      --loader-logo-secondary: #5730f5;
      transition: opacity 1s ease;
    }

    @media (prefers-color-scheme: dark) {
      #initial-loader {
        background: #020617;
        --loader-logo-primary: #ffffff;
        --loader-logo-secondary: #818cf8;
      }
    }

    /* Size the SVG loader to match navbar logo */
    #initial-loader svg {
      width: 160px;
      height: 80px;
    }

    @media (min-width: 1024px) {
      #initial-loader svg {
        width: 200px;
        height: 100px;
      }
    }

    /* Dark mode: flip dark blocks to light so logo is visible */
