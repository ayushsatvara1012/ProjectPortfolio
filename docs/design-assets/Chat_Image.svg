<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Plus Jakarta Sans" font-size="12" letter-spacing="0em"><tspan x="98" y="43.6805">Hi! Do you have any open availability for a </tspan><tspan x="98" y="58.6805">consult call this Saturday afternoon, and how </tspan><tspan x="98" y="73.6805">much does the strategy session cost?</tspan></text>
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Plus Jakarta Sans" font-size="12" letter-spacing="0em"><tspan x="26" y="111.16">Hello! Yes, we have two slots open this Saturday: 2:00 PM </tspan><tspan x="26" y="128.16">and 4:30 PM EST.&#10;</tspan><tspan x="26" y="145.16">&#10;</tspan><tspan x="26" y="162.16">The 60-minute strategy consult is $150, which includes a </tspan><tspan x="26" y="179.16">complete workflow audit and custom AI implementation </tspan><tspan x="26" y="196.16">roadmap.&#10;</tspan><tspan x="26" y="213.16">&#10;</tspan><tspan x="26" y="230.16">Would you like me to lock in the 2:00 PM slot for you now?</tspan></text>
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Plus Jakarta Sans" font-size="12" letter-spacing="0em"><tspan x="140" y="272.449">Yes, please reserve 2:00 PM for me! </tspan><tspan x="140" y="287.449">Also, what is your cancellation policy?</tspan></text>
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Plus Jakarta Sans" font-size="12" letter-spacing="0em"><tspan x="26" y="337.018">Done! I&#39;ve reserved Saturday at 2:00 PM EST for you. I&#39;ve </tspan><tspan x="26" y="356.018">sent the calendar invite and confirmation link to your email.&#10;</tspan><tspan x="26" y="375.018">&#10;</tspan><tspan x="26" y="394.018">Per our Services FAQ: You can reschedule or cancel for a full </tspan><tspan x="26" y="413.018">refund up to 24 hours prior to the session.</tspan></text>
</svg>
