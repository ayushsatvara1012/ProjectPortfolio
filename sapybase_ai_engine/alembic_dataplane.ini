# Alembic config for the BYOD **data_plane** lineage (RFC docs/rfc-byod.md A.7).
#
# This is a SECOND, independent Alembic environment, separate from the default
# `alembic.ini` / `alembic_migrations/` (which is the **control_plane** lineage
# that runs on Sapybase's own Postgres). The two lineages target two physically
# different databases and never share a revision tree or an `alembic_version`
# table:
#
#   control_plane  -> Sapybase control DB  (alembic.ini, alembic_migrations/)
#   data_plane     -> each client BYO DB   (this file,   alembic_dataplane/)
#
# The data-plane DB URL is NOT read from DATABASE_URL (that is the control
# plane). It is supplied per-invocation, either:
#   * `alembic -c alembic_dataplane.ini -x dsn=<tenant_dsn> upgrade head`  (CLI /
#     migration orchestrator, Phase 6), or
#   * the `BYOD_DATAPLANE_DATABASE_URL` env var.
# env.py fails loud if neither is provided — it never silently defaults.

[alembic]
script_location = %(here)s/alembic_dataplane

# Prepend the engine root to sys.path so the data_plane revisions can import the
# authoritative `byod_dataplane` schema constants (single source of truth).
prepend_sys_path = .

# Use os.pathsep to split list options (e.g. prepend_sys_path); silences the
# Alembic 1.18 legacy-splitting deprecation warning.
path_separator = os

# We hand-write migrations against op.execute(); autogenerate is intentionally
# unsupported (target_metadata stays None in env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
